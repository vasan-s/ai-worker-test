# .github/workflows/ai-worker.yml

name: AI Worker Manual

on:
  workflow_dispatch:
    inputs:
      ticket_id:
        description: "GitHub issue/task id"
        required: true
        type: string
      ticket_title:
        description: "Task title"
        required: true
        type: string
      ticket_body:
        description: "Task details / acceptance criteria"
        required: true
        type: string
      agent:
        description: "AI agent"
        required: true
        type: choice
        options:
          - claude
          - codex
        default: claude

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  ai-change:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show ticket input
        run: |
          echo "Ticket ID: ${{ inputs.ticket_id }}"
          echo "Title: ${{ inputs.ticket_title }}"
          echo "Agent: ${{ inputs.agent }}"

      - name: Placeholder AI step
        run: |
          echo "Later this step will run Claude Code or Codex"
          echo "For now, manual trigger is working."

      - name: Create test change
        run: |
          mkdir -p .ai-runs
          echo "AI manual run for ticket/task ${{ inputs.ticket_id }}" > .ai-runs/${{ github.run_id }}.txt
          echo "Title: ${{ inputs.ticket_title }}" >> .ai-runs/${{ github.run_id }}.txt
          echo "Agent: ${{ inputs.agent }}" >> .ai-runs/${{ github.run_id }}.txt

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          base: main
          branch: ai/task-${{ inputs.ticket_id }}-${{ github.run_id }}
          commit-message: "chore: test AI worker for task ${{ inputs.ticket_id }}"
          title: "AI task test: ${{ inputs.ticket_title }}"
          body: |
            Source: Manual workflow

            Ticket ID: ${{ inputs.ticket_id }}

            Task:
            ${{ inputs.ticket_body }}

            Agent selected: ${{ inputs.agent }}

            This is a manual test PR from the AI harness workflow.
            Human review required.
          labels: |
            ai-generated
            needs-human-review
          delete-branch: true
