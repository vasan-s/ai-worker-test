# .github/workflows/ai-worker.yml
#
# Drives an AI coding agent (currently Claude) end-to-end on a single ticket.
#
# Entry points:
#   1. Issue gets the `ready-for-ai` label
#   2. Projects v2 item Status changes to "Ready for AI"
#   3. Manual replay via workflow_dispatch
#
# The agent NEVER pushes to main. It pushes to ai/<agent>/issue-<id>-<run> and
# opens a draft PR. CI + ai-pr-guard then run on that PR and must pass before
# a human can merge.

name: AI Worker

on:
  issues:
    types: [labeled]
  projects_v2_item:
    types: [edited]
  workflow_dispatch:
    inputs:
      ticket_id:    { description: "Issue number",          required: true,  type: string }
      ticket_title: { description: "Task title",            required: true,  type: string }
      ticket_body:  { description: "Task details / AC",     required: true,  type: string }
      reviewers:    { description: "Comma-separated users", required: false, type: string }
      agent:
        description: "AI agent"
        required: true
        type: choice
        options: [claude]      # codex disabled until action name is verified
        default: claude

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ai-worker-${{ github.event.issue.number || github.event.projects_v2_item.id || inputs.ticket_id }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run:          ${{ steps.g.outputs.run }}
      agent:        ${{ steps.g.outputs.agent }}
      ticket_id:    ${{ steps.g.outputs.ticket_id }}
      ticket_title: ${{ steps.g.outputs.ticket_title }}
      ticket_body:  ${{ steps.g.outputs.ticket_body }}
      reviewers:    ${{ steps.g.outputs.reviewers }}
    steps:
      - id: g
        uses: actions/github-script@v7
        with:
          script: |
            const e = context.payload;
            let run = false, agent = 'claude';
            let ticket_id = '', ticket_title = '', ticket_body = '', reviewers = '';

            // 1. Issue labeled trigger
            if (context.eventName === 'issues' && e.action === 'labeled') {
              const labels = e.issue.labels.map(l => l.name);
              if (labels.includes('ready-for-ai')) {
                run = true;
                ticket_id    = String(e.issue.number);
                ticket_title = e.issue.title;
                ticket_body  = e.issue.body || '';
                reviewers    = (e.issue.assignees || []).map(a => a.login).join(',');
              }
            }

            // 2. Projects v2 item status change trigger
            if (context.eventName === 'projects_v2_item' && e.changes?.field_value) {
              const f = e.changes.field_value;
              if (f.field_name === 'Status' && f.to?.name === 'Ready for AI') {
                const q = `query($id: ID!) { node(id: $id) {
                  ... on ProjectV2Item { content { ... on Issue {
                    number title body assignees(first:10){nodes{login}}
                  } } }
                }}`;
                const r = await github.graphql(q, { id: e.projects_v2_item.node_id });
                const i = r.node?.content;
                if (i?.number) {
                  run = true;
                  ticket_id    = String(i.number);
                  ticket_title = i.title;
                  ticket_body  = i.body || '';
                  reviewers    = (i.assignees?.nodes || []).map(n => n.login).join(',');
                }
              }
            }

            // 3. Manual replay
            if (context.eventName === 'workflow_dispatch') {
              run = true;
              agent        = `${{ inputs.agent }}`;
              ticket_id    = `${{ inputs.ticket_id }}`;
              ticket_title = `${{ inputs.ticket_title }}`;
              ticket_body  = `${{ inputs.ticket_body }}`;
              reviewers    = `${{ inputs.reviewers }}`;
            }

            core.setOutput('run', run);
            core.setOutput('agent', agent);
            core.setOutput('ticket_id', ticket_id);
            core.setOutput('ticket_title', ticket_title);
            core.setOutput('ticket_body', ticket_body);
            core.setOutput('reviewers', reviewers || 'vasan-s');

  ai-change:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      TICKET_ID:    ${{ needs.gate.outputs.ticket_id }}
      TICKET_TITLE: ${{ needs.gate.outputs.ticket_title }}
      TICKET_BODY:  ${{ needs.gate.outputs.ticket_body }}
      AI_AGENT:     ${{ needs.gate.outputs.agent }}
      AI_DOC_PATH:  docs/ai-analysis/task-${{ needs.gate.outputs.ticket_id }}.md

    steps:
      - name: Clean workspace (self-hosted hygiene)
        run: |
          git clean -fdx || true
          git reset --hard HEAD || true

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate required harness files
        run: |
          test -f .ai-harness/prompt.md
          test -f .ai-harness/AI_DOCUMENT_TEMPLATE.md
          test -f AGENTS.md
          mkdir -p docs/ai-analysis

      - name: Show ticket input
        run: |
          echo "Ticket ID: ${TICKET_ID}"
          echo "Title:     ${TICKET_TITLE}"
          echo "Agent:     ${AI_AGENT}"

      - name: Run Claude Code
        if: needs.gate.outputs.agent == 'claude'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read AGENTS.md and .ai-harness/prompt.md before anything else.
            They are binding.

            Ticket ID: ${{ env.TICKET_ID }}
            Title: ${{ env.TICKET_TITLE }}

            Task Body:
            ${{ env.TICKET_BODY }}

            Output requirements:
            - Implement the change inside allowed paths only.
            - Create AI analysis doc at ${{ env.AI_DOC_PATH }} using
              .ai-harness/AI_DOCUMENT_TEMPLATE.md as the template.
            - Keep the change minimal and PR-ready.

      # ---- Codex disabled until action name is verified ----
      # - name: Run Codex
      #   if: needs.gate.outputs.agent == 'codex'
      #   uses: openai/codex-action@v1
      #   with:
      #     openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      #     prompt: |
      #       Read AGENTS.md and .ai-harness/prompt.md before anything else.
      #       Ticket ID: ${{ env.TICKET_ID }}
      #       Title: ${{ env.TICKET_TITLE }}
      #       Task Body:
      #       ${{ env.TICKET_BODY }}

      - name: Ensure AI made changes
        run: |
          if git diff --quiet; then
            echo "::error::Harness violation: AI made no changes."
            exit 1
          fi

      - name: Ensure AI analysis document exists
        run: |
          if [ ! -f "$AI_DOC_PATH" ]; then
            echo "::error::Harness violation: missing $AI_DOC_PATH"
            exit 1
          fi

      - name: Validate forbidden paths
        run: |
          CHANGED=$(git diff --name-only)
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -E '^(\.github/|infra/|terraform/|k8s/|helm/|secrets/|\.env|AGENTS\.md$|\.ai-harness/)'; then
            echo "::error::Harness violation: forbidden path changed."
            exit 1
          fi

      - name: Validate change size
        run: |
          FILES=$(git diff --name-only | wc -l | tr -d ' ')
          LINES=$(git diff --numstat | awk '{a+=$1;d+=$2} END{print a+d}')
          echo "Changed files: $FILES"
          echo "Changed lines: $LINES"
          [ "$FILES" -le 12 ] || { echo "::error::Too many files ($FILES > 12)"; exit 1; }
          [ "$LINES" -le 600 ] || { echo "::error::Too many lines ($LINES > 600)"; exit 1; }

      - name: Backend checks (lint + tests)
        run: |
          if [ -f backend/requirements.txt ]; then
            python3 -m venv .venv-ci
            . .venv-ci/bin/activate
            pip install -q -r backend/requirements.txt -r backend/requirements-dev.txt
            ruff check backend
            PYTHONPATH=. pytest backend/tests -q
          fi

      - name: Frontend checks (test + build)
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm ci
            npm test
            npm run build
          fi

      - name: Write PR body
        run: |
          cat > pr-body.md <<EOF
          ## Summary

          AI-generated change for: ${TICKET_TITLE}

          ## Source Task

          Closes #${TICKET_ID}

          ## AI Analysis Document

          See \`${AI_DOC_PATH}\`.

          ## Harness Result

          - AI analysis document present
          - Forbidden-path validation passed
          - Change-size validation passed (≤ 12 files / ≤ 600 lines)
          - Backend lint + tests passed
          - Frontend tests + build passed
          - Human review required

          ## Reviewer(s)

          Requested: ${{ needs.gate.outputs.reviewers }}
          EOF

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          # MUST be a PAT / App token — using GITHUB_TOKEN would suppress
          # downstream workflows (ci, ai-pr-guard) on the opened PR.
          token: ${{ secrets.AI_BOT_TOKEN }}
          base: main
          branch: ai/${{ needs.gate.outputs.agent }}/issue-${{ env.TICKET_ID }}-${{ github.run_id }}
          commit-message: "ai(${{ needs.gate.outputs.agent }}): task #${{ env.TICKET_ID }}"
          title: "[ai/${{ needs.gate.outputs.agent }}] ${{ env.TICKET_TITLE }}"
          body-path: pr-body.md
          labels: |
            ai-generated
            needs-human-review
            agent:${{ needs.gate.outputs.agent }}
          reviewers: ${{ needs.gate.outputs.reviewers }}
          delete-branch: true
          draft: true

      - name: Comment on issue
        if: env.TICKET_ID != ''
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(process.env.TICKET_ID),
              body: `AI worker (\`${process.env.AI_AGENT}\`) finished. [Logs](${run}).`,
            });
