# .github/workflows/ci.yml
#
# Required check for every PR to main. Lists `ci / ci-required` as the single
# required status check in branch protection — this job rolls up both backend
# and frontend results.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check backend

      - name: Tests (pytest)
        run: PYTHONPATH=. pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

  # Single rollup job for branch protection to require.
  ci-required:
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          [ "${{ needs.backend.result }}"  = "success" ] || { echo "backend failed"; exit 1; }
          [ "${{ needs.frontend.result }}" = "success" ] || { echo "frontend failed"; exit 1; }
          echo "All required checks passed."
